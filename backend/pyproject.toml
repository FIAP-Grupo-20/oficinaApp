[project]
name = "oficina-backend"
version = "0.1.0"
description = "OficinaApp backend API"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.4",
]

# ---------- Ruff (lint + format) ----------
[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # bugbear
    "UP",      # pyupgrade
    "N",       # pep8-naming
    "SIM",     # simplify
    "C4",      # comprehensions
    "PT",      # pytest style
    "RUF",     # ruff-specific
    "S",       # bandit (security)
    "FAST",    # FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # allow assert in tests

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.14"
strict = true
